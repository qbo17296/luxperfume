<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Admin | Lux Perfume</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="card login-card">
            <div class="login-header text-center">
                <a href="../index.html" class="logo" style="font-size: 2rem;">
                    <span class="text-gold">Lux</span> Admin
                </a>
                <p class="text-secondary mt-2">Vui lòng đăng nhập để tiếp tục</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập hoặc Email</label>
                    <input type="text" id="username" class="form-input" placeholder="Nhập admin" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-input" placeholder="Nhập admin" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Ghi nhớ đăng nhập
                    </label>
                    <a href="#" class="forgot-password text-gold">Quên mật khẩu?</a>
                </div>
                
                <button type="submit" class="btn-primary btn-full" style="justify-content: center; height: 44px;">Đăng Nhập Khám Phá</button>
                
                <div class="auth-divider" style="text-align: center; margin: 1.5rem 0; position: relative;">
                    <hr style="border: 0; border-top: 1px solid #e5e7eb; position: absolute; top: 50%; width: 100%; z-index: 1;">
                    <span style="background: var(--surface-light); padding: 0 10px; color: #6b7280; font-size: 0.875rem; position: relative; z-index: 2;">HOẶC</span>
                </div>
                
                <button type="button" id="btn-google-login" class="btn-outline btn-full" style="justify-content: center; height: 44px; display: flex; align-items: center; gap: 0.5rem; background: #fff; color: #374151; border: 1px solid #d1d5db; border-radius: 4px; font-weight: 500; cursor: pointer; transition: background 0.2s;">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Tiếp tục với Google
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification (Hidden by default) -->
    <div id="toast" class="toast-notification">
        <div class="toast-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
        </div>
        <div class="toast-message">Sai thông tin đăng nhập</div>
    </div>

    <!-- JavaScript Xử Lý Đăng Nhập -->
    <script type="module">
        import { app } from '../assets/js/firebase-config.js';
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';

        const auth = getAuth(app);
        const loginForm = document.getElementById('login-form');
        const toast = document.getElementById('toast');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnSubmit = loginForm.querySelector('button[type="submit"]');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const email = usernameInput.value.trim();
            const pass = passwordInput.value;

            // Cập nhật UI loading
            const originalBtnText = btnSubmit.innerText;
            btnSubmit.innerHTML = 'Đang xác thực...';
            btnSubmit.disabled = true;

            try {
                // Đăng nhập bằng Email & Password qua Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                
                // Kiểm tra Email có phải Admin không
                if (userCredential.user.email === 'qvinh121205@gmail.com') {
                    // Thành công chuyển hướng
                    window.location.href = 'dashboard.html';
                } else {
                    // Đăng xuất ngay lập tức và báo lỗi
                    auth.signOut();
                    document.querySelector('.toast-message').innerText = 'Tài khoản không có quyền Admin!';
                    showToast();
                    btnSubmit.innerHTML = originalBtnText;
                    btnSubmit.disabled = false;
                }
            } catch (error) {
                console.error("Lỗi đăng nhập Admin:", error);
                document.querySelector('.toast-message').innerText = 'Sai thông tin đăng nhập';
                showToast();
                btnSubmit.innerHTML = originalBtnText;
                btnSubmit.disabled = false;
            }
        });

        const btnGoogle = document.getElementById('btn-google-login');
        if(btnGoogle) {
            btnGoogle.addEventListener('click', async () => {
                const provider = new GoogleAuthProvider();
                const originalText = btnGoogle.innerHTML;
                try {
                    btnGoogle.innerHTML = 'Đang kết nối...';
                    btnGoogle.disabled = true;
                    
                    const result = await signInWithPopup(auth, provider);
                    
                    if (result.user.email === 'qvinh121205@gmail.com') {
                        window.location.href = 'dashboard.html';
                    } else {
                        // Kicking out non-admins
                        auth.signOut();
                        document.querySelector('.toast-message').innerText = 'Lỗi truy cập. Đây là trang nội bộ!';
                        showToast();
                        btnGoogle.innerHTML = originalText;
                        btnGoogle.disabled = false;
                    }
                } catch (error) {
                    console.error("Lỗi đăng nhập Google:", error);
                    document.querySelector('.toast-message').innerText = 'Hủy hoặc gặp lỗi kết nối Google';
                    showToast();
                    btnGoogle.innerHTML = originalText;
                    btnGoogle.disabled = false;
                }
            });
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thành công | Lux Perfume</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --jet-black: #111111;
            --gold-primary: #d4af37;
            --white: #ffffff;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--jet-black);
            font-family: 'Inter', sans-serif;
            color: var(--white);
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle Gold particles */
        .particle {
            position: absolute;
            background: var(--gold-primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-100px) scale(1.5); opacity: 0.1; }
            100% { transform: translateY(0) scale(1); }
        }

        .welcome-card {
            max-width: 500px;
            position: relative;
            z-index: 10;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem auto;
            color: var(--gold-primary);
            animation: scaleIn 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--gold-primary);
            margin-bottom: 1rem;
        }
        p {
            font-weight: 300;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 2.5rem;
        }

        .btn-home {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: transparent;
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            text-decoration: none;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.4s ease;
        }
        .btn-home:hover {
            background-color: var(--gold-primary);
            color: var(--jet-black);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }
        /* Confetti Animation CSS */
        .confetti {
            position: absolute;
            width: 8px;
            height: 16px;
            background-color: var(--gold-primary);
            opacity: 0;
            z-index: 1;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.4);
        }
        .c1 { left: 15%; animation: fall 4s infinite 0s linear, sway 2s infinite alternate ease-in-out; }
        .c2 { left: 35%; background-color: #fff; width: 6px; height: 12px; animation: fall 5s infinite 1.5s linear, sway 3s infinite alternate ease-in-out; }
        .c3 { left: 50%; animation: fall 3.5s infinite 0.7s linear, sway 2.5s infinite alternate ease-in-out; }
        .c4 { left: 75%; background-color: #fce7f3; width: 10px; height: 20px; animation: fall 4.5s infinite 2s linear, sway 2.2s infinite alternate ease-in-out; }
        .c5 { left: 90%; animation: fall 4s infinite 1.1s linear, sway 2s infinite alternate ease-in-out; }

        @keyframes fall {
            0% { top: -50px; opacity: 1; transform: rotate(0deg); }
            80% { opacity: 0.8; }
            100% { top: 100vh; opacity: 0; transform: rotate(360deg); }
        }
        @keyframes sway {
            0% { transform: translateX(-25px) }
            100% { transform: translateX(25px) }
        }

        .video-placeholder {
            width: 100%;
            height: 200px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            color: var(--gold-primary);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .video-placeholder:hover {
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }
        .video-placeholder svg {
            margin-bottom: 0.5rem;
            transition: transform 0.3s;
        }
        .video-placeholder:hover svg {
            transform: scale(1.1);
        }
        .video-placeholder p {
            margin-bottom: 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    
    <!-- CSS Confetti -->
    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>

    <div class="welcome-card">
        <h1>Chào mừng bạn đến với thế giới của Lux Perfume</h1>
        <p>Hành trình khám phá khứu giác đỉnh cao và những đặc quyền xa xỉ bắt đầu từ đây.</p>
        
        <!-- Video Khung Placeholder -->
        <div class="video-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            <p>Video Chào Mừng Hội Viên (Chờ Nhúng Video)</p>
        </div>

        <a href="../index.html" class="btn-home">Bắt Đầu Mua Sắm</a>
    </div>

</body>
</html>

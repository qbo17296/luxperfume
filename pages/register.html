<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Thành viên | Lux Perfume</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        
        /* Left Side: Cinematic Image */
        .split-left {
            flex: 1.2;
            background-color: var(--jet-black);
            background-image: url('../assets/images/register-bg.png');
            background-size: cover;
            background-position: center;
            position: relative;
            display: none; /* Ẩn trên mobile */
        }
        @media (min-width: 900px) {
            .split-left { display: block; }
        }
        .split-left::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.7));
        }
        
        .brand-overlay {
            position: absolute;
            bottom: 4rem;
            left: 4rem;
            z-index: 2;
            color: var(--white);
            max-width: 400px;
        }
        .brand-overlay .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--white);
            margin-bottom: 1rem;
            display: block;
        }
        .brand-overlay p {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Right Side: Form */
        .split-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            background: var(--white);
            position: relative;
        }
        .register-container {
            width: 100%;
            max-width: 440px;
        }
        .register-header {
            margin-bottom: 3rem;
            text-align: left;
        }
        .register-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--jet-black);
            margin-bottom: 0.5rem;
        }
        .register-header p {
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
        }
        
        /* Minimalist Form Inputs */
        .min-group {
            margin-bottom: 1.75rem;
            position: relative;
        }
        .min-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .min-input {
            width: 100%;
            padding: 0.875rem 0;
            border: none;
            border-bottom: 1px solid #e5e7eb;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: border-color var(--transition-fast);
            color: var(--jet-black);
        }
        .min-input:focus {
            outline: none;
            border-bottom-color: var(--gold-primary);
        }
        .min-input::placeholder {
            color: #d1d5db;
        }
        
        /* Custom Select */
        .min-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0 center;
            background-size: 1.25rem;
            padding-right: 2rem;
        }
        .min-select:focus {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        }

        /* Button Custom Gold */
        .btn-gold-submit {
            width: 100%;
            padding: 1.125rem;
            background-color: var(--gold-primary);
            color: #fff;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-gold-submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.3), rgba(255,255,255,0));
            transform: skewX(-20deg);
            transition: all 0.6s ease;
        }
        .btn-gold-submit:hover {
            background-color: var(--gold-dark);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }
        .btn-gold-submit:hover::before {
            left: 150%;
        }
        
        .login-link {
            text-align: center;
            margin-top: 2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .login-link a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .login-link a:hover { color: var(--gold-dark); }
        
        /* Back to Home Config */
        .home-float {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            transition: color 0.3s;
        }
        .home-float:hover {
            color: var(--gold-primary);
        }

        /* Validation Feedback styles */
        .error-msg {
            display: block;
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.4rem;
            font-family: 'Inter', sans-serif;
            opacity: 0;
            transition: opacity 0.3s;
            height: 0;
            overflow: hidden;
        }
        .error-msg.show {
            opacity: 1;
            height: auto;
            margin-bottom: 0.5rem;
        }
        .pwd-strength-bar {
            height: 4px;
            width: 100%;
            background-color: #f3f4f6;
            margin-top: 0.75rem;
            border-radius: 2px;
            overflow: hidden;
            display: none; /* Hide until typing */
        }
        .pwd-strength-bar.active { display: block; }
        .pwd-strength-fill {
            height: 100%;
            width: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <main class="split-layout">
        
        <!-- Nửa Trái: Ảnh Nghệ Thuật -->
        <div class="split-left">
            <div class="brand-overlay">
                <span class="logo"><span class="text-gold">Lux</span> Perfume</span>
                <p>Nơi khám phá bản nguyên của khứu giác. Gia nhập cộng đồng xa xỉ giới để nhận những đặc quyền độc bản dành riêng cho quý khách.</p>
            </div>
        </div>
        
        <!-- Nửa Phải: Form Đăng Ký -->
        <div class="split-right">
            
            <a href="../index.html" class="home-float">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Quay lại Trang chủ
            </a>
            
            <div class="register-container">
                <div class="register-header">
                    <h1>Trở thành Hội viên.</h1>
                    <p>Mở khóa thế giới mùi hương độc quyền của Lux Perfume.</p>
                </div>
                
                <form action="#" id="registrationForm">
                    <div class="min-group">
                        <label>Họ và Tên</label>
                        <input type="text" id="fullname" class="min-input" placeholder="Ví dụ: Hoàng Anh..." required>
                        <span class="error-msg"></span>
                    </div>
                    
                    <div class="min-group">
                        <label>Tên Đăng Nhập (Username)</label>
                        <input type="text" id="username" class="min-input" placeholder="Ví dụ: hoanganh_lux" required>
                        <span class="error-msg"></span>
                    </div>
                    
                    <div class="min-group">
                        <label>Email liên hệ</label>
                        <input type="email" id="email" class="min-input" placeholder="email@example.com" required>
                        <span class="error-msg"></span>
                    </div>
                    
                    <div class="min-group">
                        <label>Số điện thoại</label>
                        <input type="tel" id="phone" class="min-input" placeholder="Nhập số điện thoại" required>
                        <span class="error-msg"></span>
                    </div>
                    
                    <div class="min-group">
                        <label>Dòng hương yêu thích nhất của bạn</label>
                        <select id="favorite-scent" class="min-input min-select" required>
                            <option value="" disabled selected>Chọn một mùi hương...</option>
                            <option value="woody">Hương Gỗ (Woody)</option>
                            <option value="floral">Hương Hoa Cỏ (Floral)</option>
                            <option value="fruity">Hương Trái Cây (Fruity)</option>
                            <option value="unisex">Unisex (Pha trộn)</option>
                        </select>
                        <span class="error-msg"></span>
                    </div>

                    <div class="min-group" style="margin-bottom: 2.5rem;">
                        <label>Mật khẩu</label>
                        <input type="password" id="password" class="min-input" placeholder="Tối thiểu 8 ký tự, có chữ hoa & số" required>
                        <div class="pwd-strength-bar" id="pwd-bar-track">
                            <div class="pwd-strength-fill" id="pwd-strength"></div>
                        </div>
                        <span class="error-msg"></span>
                    </div>
                    
                    <button type="submit" class="btn-gold-submit">Đăng Ký</button>
                    
                    <div class="login-link">
                        Đã có thẻ thành viên? <a href="#">Đăng nhập ngay</a>
                    </div>
                </form>
            </div>
        </div>
        
    </main>

    <script type="module" src="../assets/js/firebase-config.js"></script>
    <script type="module" src="../assets/js/register.js"></script>
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>

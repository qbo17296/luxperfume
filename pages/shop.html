<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khám phá toàn bộ bộ sưu tập nước hoa niche độc bản từ Lux Perfume.">
    <title>Cửa Hàng | Lux Perfume</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        /* Specific Styles for Shop Page */
        .page-header {
            padding: calc(var(--spacing-xl) + 80px) 0 var(--spacing-xl);
            background: linear-gradient(to bottom, var(--surface-light), var(--bg-color));
            text-align: center;
            border-bottom: 1px solid var(--border-light);
        }

        .shop-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: var(--spacing-lg);
            padding: var(--spacing-xl) 0;
            align-items: start;
        }

        /* Sidebar Filters */
        .filter-sidebar {
            position: sticky;
            top: 100px;
        }

        .filter-group {
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-light);
        }

        .filter-title {
            font-size: var(--text-sm);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .filter-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: var(--text-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: color var(--transition-fast);
        }

        .filter-label:hover {
            color: var(--gold-dark);
        }

        /* Checkbox styling */
        .filter-label input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--text-secondary);
            background-color: transparent;
            position: relative;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .filter-label input[type="checkbox"]:checked {
            border-color: var(--gold-primary);
            background-color: var(--gold-primary);
        }

        .filter-label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
        }

        /* Shop Top Bar */
        .shop-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .sort-select {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            padding: 0.5rem 1rem;
            font-family: var(--font-body);
            font-size: var(--text-sm);
            outline: none;
            cursor: pointer;
        }

        .sort-select:focus {
            border-color: var(--gold-primary);
        }

        .sort-select option {
            background-color: var(--surface-color);
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .shop-layout {
                grid-template-columns: 1fr;
            }
            .filter-sidebar {
                position: static;
                margin-bottom: var(--spacing-md);
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <include src="components/header.html"></include>
    
    <main>
        <!-- Page Header -->
        <div class="page-header fade-up">
            <div class="container">
                <h1 class="section-title">Nghệ Thuật Mùi Hương</h1>
                <p class="section-desc">Mỗi chai nước hoa là một câu chuyện riêng, chờ đợi bạn khám phá và khoác lên mình.</p>
            </div>
        </div>

        <!-- Shop Content -->
        <section class="container shop-layout">
            <!-- Sidebar Filters -->
            <aside class="filter-sidebar fade-up delay-1">
                <div class="filter-group">
                    <h3 class="filter-title">Khám Phá Hương Thơm</h3>
                    <div class="visual-filters">
                        <button class="filter-tag active" data-filter="all">Tất cả</button>
                        <button class="filter-tag" data-filter="woody">🪵 Hương Gỗ</button>
                        <button class="filter-tag" data-filter="floral">🌺 Hương Hoa</button>
                        <button class="filter-tag" data-filter="citrus">🍋 Cam Chanh</button>
                        <button class="filter-tag" data-filter="oriental">✨ Phương Đông</button>
                    </div>
                </div>
            </aside>

            <!-- Main Shop Area -->
            <div class="shop-main">
                <div class="shop-topbar fade-up delay-1">
                    <p class="text-secondary"><span id="product-count">8</span> sản phẩm</p>
                    <select class="sort-select" id="sort-select">
                        <option value="featured">Nổi bật nhất</option>
                        <option value="newest">Mới cập nhật</option>
                        <option value="price-asc">Giá: Thấp đến Cao</option>
                        <option value="price-desc">Giá: Cao xuống Thấp</option>
                    </select>
                </div>

                <div class="product-grid" id="shop-grid">
                    <!-- Sản phẩm sẽ được render bằng Javascript (shop.js) thay cho HTML tĩnh -->
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer -->
    <include src="components/footer.html"></include>

    
    <script type="module" src="/assets/js/main.js"></script>
    
    <script type="module" src="/assets/js/shop.js"></script>
</body>
</html>
